<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layouts/layout :: layout(${title}, 'register', ~{::main})}">
<head>
    <title>Crear una Cuenta | E-Commerce</title>
</head>
<body>

    <main class="flex-grow flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-md space-y-6">

            <!-- Register Box Header -->
            <div class="text-center space-y-2">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 p-0.5 shadow-xl shadow-emerald-500/20">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-2xl">
                        ✨
                    </div>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-100 tracking-tight">Crea tu Cuenta</h1>
                <p class="text-slate-400 text-sm">Regístrate para comprar y explorar el catálogo de productos</p>
            </div>

            <!-- Registration Form Card -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-md space-y-6">
                
                <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">
                    
                    <!-- Username -->
                    <div class="space-y-1.5">
                        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Nombre de Usuario *</label>
                        <input type="text" id="username" th:field="*{username}" placeholder="ej: juangomez" required
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Email -->
                    <div class="space-y-1.5">
                        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Correo Electrónico *</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="juan@ejemplo.com" required
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Full Name -->
                    <div class="space-y-1.5">
                        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Nombre Completo *</label>
                        <input type="text" id="name" th:field="*{name}" placeholder="Juan Gómez" required
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Password -->
                    <div class="space-y-1.5">
                        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Contraseña *</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Confirm Password -->
                    <div class="space-y-1.5">
                        <label for="confirmPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Confirmar Contraseña *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button type="submit"
                                class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-extrabold text-sm shadow-xl shadow-emerald-500/20 transition transform hover:-translate-y-0.5 cursor-pointer">
                            ✨ Registrarse y Crear Cuenta
                        </button>
                    </div>

                </form>

                <!-- Footer Link -->
                <div class="pt-4 border-t border-slate-800 text-center">
                    <p class="text-xs text-slate-400">
                        ¿Ya tienes una cuenta registrada?
                        <a th:href="@{/login}" class="text-emerald-400 hover:text-emerald-300 font-bold transition">
                            🔑 Inicia Sesión Aquí
                        </a>
                    </p>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
