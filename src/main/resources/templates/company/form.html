<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es"
      th:replace="~{layouts/admin-layout :: adminLayout(${title}, 'company', ~{::main})}">
<head>
    <title>Configuración de la Empresa</title>
</head>
<body>

    <main class="space-y-6 max-w-4xl mx-auto">

        <!-- Form Card Container -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur">
            
            <!-- Header -->
            <div class="flex items-center gap-4 pb-6 border-b border-slate-800">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-purple-500/20">
                    🏢
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-100">Datos Corporativos de la Empresa</h1>
                    <p class="text-xs text-slate-400">Esta información se utilizará de forma automática en los membretes y comprobantes de facturación (PDF e impresos).</p>
                </div>
            </div>

            <!-- Form -->
            <form th:action="@{/admin/company}" th:object="${company}" method="post" class="space-y-8 pt-6">
                
                <input type="hidden" th:field="*{id}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Company Name -->
                    <div class="space-y-2">
                        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Nombre de la Empresa / Razón Social *
                        </label>
                        <input type="text" id="name" th:field="*{name}"
                               placeholder="Ej. TIENDA ONLINE E-COMMERCE SpA"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm font-medium" />
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Tax ID (RUT) -->
                    <div class="space-y-2">
                        <label for="taxId" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            RUT / Identificador Fiscal *
                        </label>
                        <input type="text" id="taxId" th:field="*{taxId}"
                               placeholder="Ej. 76.543.210-9"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm font-mono" />
                        <span th:if="${#fields.hasErrors('taxId')}" th:errors="*{taxId}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Address -->
                    <div class="space-y-2 md:col-span-2">
                        <label for="address" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Dirección Principal *
                        </label>
                        <input type="text" id="address" th:field="*{address}"
                               placeholder="Ej. Av. Principal 123, Oficina 402, Santiago, Chile"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm font-medium" />
                        <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Phone -->
                    <div class="space-y-2">
                        <label for="phone" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Teléfono de Contacto
                        </label>
                        <input type="text" id="phone" th:field="*{phone}"
                               placeholder="Ej. +56 9 1234 5678"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm font-mono" />
                    </div>

                    <!-- Email -->
                    <div class="space-y-2">
                        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Correo Electrónico Oficial
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                               placeholder="Ej. contacto@tienda.com"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm font-medium" />
                    </div>

                    <!-- Website -->
                    <div class="space-y-2 md:col-span-2">
                        <label for="website" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Sitio Web / Portal
                        </label>
                        <input type="text" id="website" th:field="*{website}"
                               placeholder="Ej. www.tienda.com"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition text-sm font-mono" />
                    </div>

                </div>

                <!-- Form Actions -->
                <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-800">
                    <a th:href="@{/admin/products}" class="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 font-semibold text-sm transition">
                        ← Cancelar
                    </a>
                    <button type="submit"
                            class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-purple-600/20 transition cursor-pointer">
                        💾 Guardar Datos de la Empresa
                    </button>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
