<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es"
      th:replace="~{layouts/admin-layout :: adminLayout(${title}, 'users', ~{::main})}">
<head>
    <title>Formulario de Usuario</title>
</head>
<body>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">

        <!-- Section Header -->
        <div class="flex items-center justify-between gap-4 border-b border-slate-800 pb-6">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-2">
                    👥 Gestión de Usuarios
                </div>
                <h1 class="text-3xl font-extrabold text-slate-100 tracking-tight" th:text="${title}">Formulario de Usuario</h1>
                <p class="text-slate-400 text-sm mt-1">Completa los campos obligatorios para registrar o modificar datos de usuario y permisos de acceso.</p>
            </div>
            <a th:href="@{/admin/users}" class="px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 text-sm font-semibold transition">
                ← Volver al Listado
            </a>
        </div>

        <!-- User Form Card -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-md">
            <form th:action="@{/admin/users/form}" th:object="${user}" method="post" class="space-y-6">

                <input type="hidden" th:field="*{id}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Username -->
                    <div class="space-y-2">
                        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Nombre de Usuario *</label>
                        <input type="text" id="username" th:field="*{username}" placeholder="ej: jgarcia"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Email -->
                    <div class="space-y-2">
                        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Correo Electrónico *</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="ej: usuario@tienda.com"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Full Name -->
                    <div class="space-y-2 md:col-span-2">
                        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Nombre Completo *</label>
                        <input type="text" id="name" th:field="*{name}" placeholder="ej: Juan García"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2 md:col-span-2">
                        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Contraseña <span th:if="${isNew}">*</span>
                        </label>
                        <input type="password" id="password" th:field="*{password}" placeholder="••••••••"
                               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" />
                        <p th:unless="${isNew}" class="text-[11px] text-slate-400 font-medium">Dejar en blanco si no deseas modificar la contraseña actual.</p>
                        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                    <!-- Enabled Toggle -->
                    <div class="space-y-2 md:col-span-2 pt-2 border-t border-slate-800">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" th:field="*{enabled}" class="w-5 h-5 rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-emerald-500 cursor-pointer" />
                            <span class="text-sm font-bold text-slate-200">Usuario Activo (Habilitar inicio de sesión)</span>
                        </label>
                    </div>

                    <!-- Roles Checkboxes -->
                    <div class="space-y-3 md:col-span-2 pt-4 border-t border-slate-800">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Asignar Roles y Permisos *</label>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div th:each="role : ${allRoles}"
                                 class="p-4 rounded-2xl bg-slate-950 border border-slate-800 hover:border-slate-700 transition">
                                <label class="flex items-start gap-3 cursor-pointer">
                                    <input th:if="${role.name == 'ROLE_ADMIN' and !isNew and user.roles != null and user.roles.contains(role) and activeAdminsCount <= 1}"
                                           type="checkbox" th:value="${role.id}" checked="checked" disabled="disabled"
                                           class="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 text-purple-500 cursor-not-allowed opacity-75" />
                                    <input th:if="${role.name == 'ROLE_ADMIN' and !isNew and user.roles != null and user.roles.contains(role) and activeAdminsCount <= 1}"
                                           type="hidden" name="roleIds" th:value="${role.id}" />

                                    <input th:unless="${role.name == 'ROLE_ADMIN' and !isNew and user.roles != null and user.roles.contains(role) and activeAdminsCount <= 1}"
                                           type="checkbox" name="roleIds" th:value="${role.id}"
                                           th:checked="${user.roles != null and user.roles.contains(role)}"
                                           class="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-emerald-500 cursor-pointer" />
                                    <div>
                                        <span class="block font-bold text-sm text-slate-100" th:text="${role.name}">ROLE_USER</span>
                                        <span th:if="${role.name == 'ROLE_ADMIN'}" class="text-[11px] text-purple-400 block font-medium">Acceso Total al Panel y Configuración</span>
                                        <span th:if="${role.name == 'ROLE_ADMIN' and !isNew and user.roles != null and user.roles.contains(role) and activeAdminsCount <= 1}"
                                              class="text-[10px] text-amber-400 font-semibold block mt-1">
                                            🔒 Protegido: Único administrador activo del sistema
                                        </span>
                                        <span th:if="${role.name == 'ROLE_BILLING'}" class="text-[11px] text-amber-400 block font-medium">Gestión de Compras y Facturación</span>
                                        <span th:if="${role.name == 'ROLE_USER'}" class="text-[11px] text-emerald-400 block font-medium">Usuario Cliente Regular de la Tienda</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <span th:if="${roleError != null}" th:text="${roleError}" class="text-xs text-rose-400 font-semibold block"></span>
                    </div>

                </div>

                <!-- Form Actions -->
                <div class="flex items-center justify-end gap-3 pt-6 border-t border-slate-800">
                    <a th:href="@{/admin/users}" class="px-5 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 font-semibold text-sm transition">
                        ← Cancelar
                    </a>
                    <button type="submit"
                            class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition cursor-pointer">
                        💾 Guardar Usuario
                    </button>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
