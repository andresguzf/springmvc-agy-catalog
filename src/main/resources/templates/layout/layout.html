<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">12-springmvc-app</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar Fragment -->
    <header th:fragment="header(activePage)" class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a th:href="@{/}" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-slate-900 text-xl shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                        12
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                        12-springmvc-app
                    </span>
                </a>
            </div>
            <nav class="flex items-center space-x-6 text-sm font-medium">
                <a th:href="@{/}"
                   th:class="${activePage == 'home' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition' : 'text-slate-400 hover:text-slate-200 transition'}">
                    Inicio
                </a>
                <a th:href="@{/products}"
                   th:class="${activePage == 'products' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition' : 'text-slate-400 hover:text-slate-200 transition'}">
                    Productos
                </a>
            </nav>
        </div>
    </header>

    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="bg-slate-800/40 border-t border-slate-800 py-6 text-center text-sm text-slate-500">
        <p>© 2026 12-springmvc-app. Catálogo gestionado con Spring Boot 4.1 & PostgreSQL.</p>
    </footer>

</body>
</html>
