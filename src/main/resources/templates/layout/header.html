<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<body>

    <!-- Header / Navbar Fragment -->
    <header th:fragment="header(activePage)" class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a th:href="@{/}" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-slate-900 text-xl shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                        12
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                        12-springmvc-app
                    </span>
                </a>
            </div>
            <nav class="flex items-center space-x-6 text-sm font-medium">
                <a th:href="@{/}"
                   th:class="${activePage == 'home' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition' : 'text-slate-400 hover:text-slate-200 transition'}">
                    Inicio
                </a>
                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{/admin/products}"
                   th:class="${activePage == 'products' or activePage == 'users' or activePage == 'invoices' or activePage == 'admin' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition' : 'text-slate-400 hover:text-slate-200 transition'}">
                    🛡️ Panel Admin
                </a>
                <a sec:authorize="hasRole('BILLING') and !hasRole('ADMIN')"
                   th:href="@{/admin/invoices}"
                   th:class="${activePage == 'invoices' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition' : 'text-slate-400 hover:text-slate-200 transition'}">
                    🧾 Panel Facturación
                </a>
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/user/orders}"
                   th:class="${activePage == 'my-orders' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition' : 'text-slate-400 hover:text-slate-200 transition'}">
                    🛍️ Mis Compras
                </a>
                <a th:href="@{/cart}"
                   th:class="${activePage == 'cart' ? 'text-emerald-400 font-semibold border-b-2 border-emerald-400 pb-1 transition flex items-center gap-1.5' : 'text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5'}">
                    🛒 Carrito
                    <span th:if="${@cart.totalQuantity gt 0}"
                          th:text="${@cart.totalQuantity}"
                          class="px-2 py-0.5 rounded-full bg-emerald-500 text-slate-950 font-extrabold text-xs font-mono shadow-md">
                        0
                    </span>
                </a>

                <!-- Security / User Authentication Controls -->
                <div sec:authorize="isAnonymous()" class="flex items-center space-x-2">
                    <a th:href="@{/register}"
                       class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold text-xs transition">
                        ✨ Registrarse
                    </a>
                    <a th:href="@{/login}"
                       class="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-xs shadow-md transition transform hover:-translate-y-0.5">
                        🔑 Iniciar Sesión
                    </a>
                </div>

                <div sec:authorize="isAuthenticated()" class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 bg-slate-900/60 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        <span class="text-slate-300 font-medium" sec:authentication="name">Usuario</span>
                        <span sec:authorize="hasRole('ADMIN')" class="px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-400 font-mono text-[10px]">ADMIN</span>
                        <span sec:authorize="hasRole('BILLING') and !hasRole('ADMIN')" class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-mono text-[10px]">BILLING</span>
                        <span sec:authorize="hasRole('USER') and !hasRole('ADMIN') and !hasRole('BILLING')" class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-mono text-[10px]">USER</span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="inline">
                        <button type="submit"
                                class="px-3.5 py-1.5 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-300 hover:text-slate-100 border border-slate-600/50 text-xs font-medium transition cursor-pointer">
                            🚪 Salir
                        </button>
                    </form>
                </div>
            </nav>
        </div>
    </header>

</body>
</html>
