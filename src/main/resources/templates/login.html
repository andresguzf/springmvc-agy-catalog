<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layouts/layout :: layout(${title}, 'login', ~{::main})}">
<head>
    <title>Iniciar Sesión | Spring Web MVC</title>
</head>
<body>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center max-w-7xl w-full mx-auto px-6 py-12">
        <div class="w-full max-w-md bg-slate-800/80 border border-slate-700/60 rounded-3xl p-8 shadow-2xl space-y-6 backdrop-blur">
            
            <div class="text-center space-y-2">
                <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 items-center justify-center text-slate-950 text-2xl font-black shadow-lg shadow-emerald-500/20 mb-2">
                    🔐
                </div>
                <h1 class="text-2xl font-bold text-slate-100">Iniciar Sesión</h1>
                <p class="text-sm text-slate-400">Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-5">
                
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Usuario
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                            👤
                        </span>
                        <input type="text" id="username" name="username" required autofocus
                               placeholder="Nombre de usuario"
                               class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Contraseña
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                            🔑
                        </span>
                        <input type="password" id="password" name="password" required
                               placeholder="••••••••"
                               class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-sm shadow-xl shadow-emerald-500/20 transition transform hover:-translate-y-0.5">
                    Entrar al Sistema
                </button>
            </form>

            <!-- Register Link & Test Credentials Hint -->
            <div class="pt-4 border-t border-slate-700/60 text-xs text-slate-400 space-y-3">
                <p class="text-center text-slate-300">
                    ¿No tienes una cuenta?
                    <a th:href="@{/register}" class="text-emerald-400 hover:text-emerald-300 font-bold transition">
                        ✨ Regístrate aquí
                    </a>
                </p>

                <div class="space-y-1.5 pt-2 border-t border-slate-800">
                    <p class="font-semibold text-slate-300">💡 Credenciales de prueba:</p>
                    <div class="flex justify-between bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-800 font-mono">
                        <span>Admin: <strong class="text-purple-400">admin</strong> / 12345</span>
                        <span class="text-slate-500 text-[10px]">ROLE_ADMIN</span>
                    </div>
                    <div class="flex justify-between bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-800 font-mono">
                        <span>Billing: <strong class="text-amber-400">billing</strong> / 12345</span>
                        <span class="text-slate-500 text-[10px]">ROLE_BILLING</span>
                    </div>
                    <div class="flex justify-between bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-800 font-mono">
                        <span>Usuario: <strong class="text-emerald-400">user</strong> / 12345</span>
                        <span class="text-slate-500 text-[10px]">ROLE_USER</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
